name: validate
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,production]'
      - run: python -m ruff check ironclad tests
      - run: python -m mypy ironclad
      - run: python -m pytest --cov=ironclad.engine --cov=ironclad.fleet --cov=ironclad.repository --cov-fail-under=80
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ironclad
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: ironclad
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ironclad"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,production]'
      - run: python -m pytest tests/test_services.py -q
        env:
          IRONCLAD_TEST_POSTGRES: postgresql://ironclad:ephemeral-ci-only@localhost:5432/ironclad
          IRONCLAD_TEST_REDIS: redis://localhost:6379/0
      - run: docker build -f Dockerfile.sandbox -t ironclad-sandbox:local .
      - run: python scripts/smoke_docker.py
