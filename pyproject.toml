[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ironclad-guardian"
version = "0.1.0"
description = "Event-sourced codebase diagnosis and patch proposals"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]
[project.optional-dependencies]
redis = ["redis>=5,<7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14"]
[project.scripts]
ironclad = "ironclad.cli:main"
[tool.setuptools.packages.find]
include = ["ironclad*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.mypy]
strict = true
