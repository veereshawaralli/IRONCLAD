services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      IRONCLAD_DB: /data/events.db
      IRONCLAD_REPO: /repository
    volumes:
      - state:/data
      - ${IRONCLAD_REPO_HOST:-./examples/broken_repo}:/repository:ro
    restart: unless-stopped
  worker:
    build: .
    command: python -m ironclad.worker
    env_file: .env
    environment:
      IRONCLAD_DB: /data/events.db
      IRONCLAD_REPO: /repository
    volumes:
      - state:/data
      - ${IRONCLAD_REPO_HOST:-./examples/broken_repo}:/repository:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Sandbox snapshots use the same absolute path inside the worker and host.
      - /tmp/ironclad-sandboxes:/tmp/ironclad-sandboxes
    restart: unless-stopped
volumes:
  state:
